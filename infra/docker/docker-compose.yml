services:
  postgres:
    image: postgres:17-alpine
    container_name: codegate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codegate
      POSTGRES_PASSWORD: codegate
      POSTGRES_DB: codegate
    ports:
      # Host 5434 to avoid clashing with other local Postgres instances.
      - "5434:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codegate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codegate-redis
    restart: unless-stopped
    ports:
      # Host 6380 to avoid clashing with other local Redis instances.
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
