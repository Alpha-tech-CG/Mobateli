packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (flagged by Semgrep's p/ci on CodeGate itself):
# - wait 7 days before installing a freshly published version — most
#   malicious releases are caught and yanked within that window;
# - refuse an update whose provenance/trust level is lower than before;
# - transitive deps may only come from the registry (no git/tarball URLs).
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Native/postinstall build scripts are blocked by default (supply-chain
# hardening). Only the packages below — which genuinely need to compile or
# fetch engines — are allowed to run scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  # Optional native accelerator for BullMQ's msgpackr — pure-JS fallback is
  # fine, so we keep it blocked.
  msgpackr-extract: false
  prisma: true
  # Next.js image optimizer (native). Standard dependency — allowed.
  sharp: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp

# Security: transitive zod < 4.6.6 is vulnerable (GHSA-mrhx-c7xc-m3w5),
# pulled by @vercel/functions → @vercel/oidc → @vercel/cli-config.
overrides:
  zod: ^4.6.7
  # GHSA-ggr8-5vv4-36mx (stack exhaustion) — via prisma → @prisma/config.
  deepmerge-ts: ^8.0.2
  # GHSA-qx2v-qp2m-jg93 & co. (XSS in stringify) — next pins postcss 8.4.31.
  postcss: ^8.5.32
