packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (flagged by Semgrep's p/ci on CodeGate itself):
# - wait 7 days before installing a freshly published version — most
#   malicious releases are caught and yanked within that window;
# - refuse an update whose provenance/trust level is lower than before;
# - transitive deps may only come from the registry (no git/tarball URLs).
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Native/postinstall build scripts are blocked by default (supply-chain
# hardening). Only the packages below — which genuinely need to compile or
# fetch engines — are allowed to run scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  # Optional native accelerator for BullMQ's msgpackr — pure-JS fallback is
  # fine, so we keep it blocked.
  msgpackr-extract: false
  prisma: true
  # Next.js image optimizer (native). Standard dependency — allowed.
  sharp: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp

# Security overrides for vulnerable transitive dependencies (pnpm audit).
# next@15 pins postcss 8.4.31 (path traversal / file read via sourceMap,
# XSS in stringify — GHSA-6g55-p6wh-862q and follow-ups).
overrides:
  postcss: ^8.5.23

# Advisories reviewed and accepted (CI runs `pnpm audit --prod --audit-level=high`;
# anything new fails it). Revisit on each entry's next release.
auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 — stack exhaustion on recursive object graphs. Only
    # reached by the Prisma CLI loading its own config, never by request data.
    - GHSA-ggr8-5vv4-36mx
