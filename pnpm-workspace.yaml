packages:
  - "apps/*"
  - "packages/*"

# Native/postinstall build scripts are blocked by default (supply-chain
# hardening). Only the packages below — which genuinely need to compile or
# fetch engines — are allowed to run scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  # Optional native accelerator for BullMQ's msgpackr — pure-JS fallback is
  # fine, so we keep it blocked.
  msgpackr-extract: false
  prisma: true
  # Next.js image optimizer (native). Standard dependency — allowed.
  sharp: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp

# Security floors for transitive dependencies whose parents still pin a
# vulnerable version (found by the Trivy SCA scan):
#  - postcss < 8.5.23 (pinned by next@15): CVE-2026-45623, -73646, -41305, -69153
#  - deepmerge-ts < 8 (pinned by @prisma/config@6): CVE-2026-40345
overrides:
  postcss: ^8.5.32
  deepmerge-ts: ^8.0.2
