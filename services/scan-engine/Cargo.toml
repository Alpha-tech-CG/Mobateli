[package]
name = "codegate-scan"
version = "0.1.0"
edition = "2024"

[dependencies]
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_span = "0.157.0"
oxc_syntax = "0.157.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
